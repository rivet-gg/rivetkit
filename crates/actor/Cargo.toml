[package]
name = "agentos-actor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Static Rust RivetKit actor for the hosted agentOS API"

[dependencies]
agentos-client = { workspace = true }
anyhow = "1"
async-trait = "0.1"
hex = "0.4"
rivetkit = "=2.3.12-rc.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
