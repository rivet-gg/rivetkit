[package]
name = "agentos-actor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Static Rust RivetKit actor for the hosted agentOS API"

[features]
default = []
contract = ["agentos-client/contract", "dep:ts-rs"]

[dependencies]
agentos-client = { workspace = true }
agentos-sidecar-client = { workspace = true }
anyhow = "1"
async-trait = "0.1"
ciborium = "0.2"
futures = "0.3"
hex = "0.4"
http = "1"
rivetkit = "=2.3.12-rc.3"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
ts-rs = { version = "10.1", features = ["no-serde-warnings", "serde-compat", "serde-json-impl"], optional = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
